name: Riptide
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  RiptideCore:
    path: .
  SwiftMarkdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: 0.8.0
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 154.0.0
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  Riptide:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [BuildInfo.plist, RiptidePush.entitlements]
      - path: Rendering/RichContent
        type: folder
        buildPhase: resources
    dependencies:
      - package: RiptideCore
      - target: RiptideSafari
        embed: true
      - package: SwiftMarkdown
        product: Markdown
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.riptide.client
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/BuildInfo.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Riptide
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Riptide uses your microphone only during an outgoing voice call.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Riptide connects to agents and notification relays you pair on your private network.
        CODE_SIGN_ENTITLEMENTS: $(RIPTIDE_PUSH_ENTITLEMENTS)
        RIPTIDE_PUSH_ENVIRONMENT: ""
        SWIFT_VERSION: "6.0"
  RiptideSafari:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariExtension
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.riptide.client.safari
        INFOPLIST_FILE: SafariExtension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
  RiptideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Riptide
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.riptide.client.uitests
        SWIFT_VERSION: "6.0"
schemes:
  Riptide:
    build:
      targets:
        Riptide: all
    test:
      targets: [RiptideUITests]
