<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Riptide</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
</head>
<body>
    <main>
        <section id="view" aria-live="polite">
            <h1 id="heading">Connecting…</h1>
            <p id="description"></p>
            <form id="pairing" hidden>
                <label for="code">Pairing code</label>
                <input id="code" type="password" autocomplete="off" autocapitalize="off"
                       spellcheck="false" required placeholder="Paste from your agent host">
                <button type="submit">Connect</button>
            </form>
            <button id="primary" type="button" hidden></button>
            <button id="refresh" class="secondary" type="button" hidden>Check for handoff</button>
            <p id="error" role="alert" hidden></p>
        </section>
        <details id="settings" hidden>
            <summary>Connection settings</summary>
            <button id="disconnect" class="secondary" type="button">Disconnect</button>
        </details>
    </main>
</body>
</html>
