<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Riptide</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
</head>
<body>
    <main>
        <section id="view" aria-live="polite">
            <h1 id="heading">Connecting…</h1>
            <p id="description"></p>
            <label id="agent-picker" for="agent" hidden>Paired agent
                <select id="agent"></select>
            </label>
            <button id="primary" type="button" hidden></button>
            <button id="refresh" class="secondary" type="button" hidden>Check for handoff</button>
            <p id="error" role="alert" hidden></p>
        </section>
    </main>
</body>
</html>
