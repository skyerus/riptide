<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data: blob:">
<style>
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101114; }
  body { display: flex; flex-direction: column; font: 16px -apple-system, sans-serif; color: white; }
  #screen { flex: 1; min-height: 0; overflow: hidden; }
  #keyboard { align-self: center; margin: 6px; padding: 12px 20px; border: 0; border-radius: 9px; background: #292b32; color: inherit; font: inherit; }
  #keys { position: fixed; left: 50%; top: 8px; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; font-size: 16px; }
</style>
</head>
<body>
<div id="screen"></div>
<button id="keyboard" hidden>Show keyboard</button>
<input id="keys" type="password" aria-label="Remote keyboard" autocomplete="off" inputmode="text">
<script src="hermes-screen.js"></script>
</body>
</html>
